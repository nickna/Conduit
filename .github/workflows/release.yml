name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
      build_timestamp: ${{ steps.version.outputs.build_timestamp }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag, master ancestry and exact-SHA CI
        id: version
        run: node scripts/ci/validate-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  docker:
    name: Build candidate - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: webadmin
            context: .
            dockerfile: WebAdmin/Dockerfile
          - service: http
            context: .
            dockerfile: Services/ConduitLLM.Gateway/Dockerfile
          - service: admin
            context: .
            dockerfile: Services/ConduitLLM.Admin/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # Candidate tags are not consumed by deployments. Official version/channel
          # tags are promoted only after the production migration succeeds.
          tags: ${{ env.REGISTRY }}/nickna/conduit-${{ matrix.service }}:${{ needs.metadata.outputs.version }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT_SHA=${{ needs.metadata.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ needs.metadata.outputs.build_timestamp }}

      - name: Record immutable candidate identity
        run: node scripts/ci/release-images.mjs record "$SERVICE" "$IMAGE" "$DIGEST" "$VERSION" "$SOURCE_SHA"
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ env.REGISTRY }}/nickna/conduit-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_SHA: ${{ needs.metadata.outputs.commit_sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jit-candidate-${{ matrix.service }}
          path: artifacts/candidates/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 30

  candidates:
    name: Validate exact release image set
    runs-on: ubuntu-latest
    needs: [metadata, docker]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jit-candidate-*
          merge-multiple: true
          path: artifacts/candidates
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble the complete immutable image set
        id: images
        run: node scripts/ci/release-images.mjs assemble artifacts/candidates artifacts/release/image-set.json
      - name: Pull the exact candidates
        run: |
          docker pull "$ADMIN"
          docker pull "$GATEWAY"
          docker pull "$WEBADMIN"
        env:
          ADMIN: ${{ steps.images.outputs.admin }}
          GATEWAY: ${{ steps.images.outputs.http }}
          WEBADMIN: ${{ steps.images.outputs.webadmin }}
      - name: Prepare security evidence
        run: mkdir -p artifacts/security
      - name: Scan exact admin release candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ steps.images.outputs.admin }}
          format: json
          output: artifacts/security/admin.json
          exit-code: '0'
      - name: Scan exact http release candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ steps.images.outputs.http }}
          format: json
          output: artifacts/security/http.json
          exit-code: '0'
      - name: Scan exact webadmin release candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ steps.images.outputs.webadmin }}
          format: json
          output: artifacts/security/webadmin.json
          exit-code: '0'
      - name: Enforce candidate severity and approved exception policy
        run: node scripts/ci/security-check.mjs image artifacts/security/admin.json artifacts/security/http.json artifacts/security/webadmin.json
      - name: Retain candidate vulnerability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-security-evidence
          path: artifacts/security
          retention-days: 30
      - name: Install locked browser tooling
        working-directory: tools/ci
        run: |
          npm ci
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Execute exact candidates through business and browser flows
        run: node scripts/ci/container-smoke.mjs
        env:
          CI_ADMIN_IMAGE: ${{ steps.images.outputs.admin }}
          CI_GATEWAY_IMAGE: ${{ steps.images.outputs.http }}
          CI_WEBADMIN_IMAGE: ${{ steps.images.outputs.webadmin }}
          CI_BROWSER_MODULE: tools/ci/browser-smoke.mjs
      - name: Retain candidate execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-evidence
          path: artifacts/container-smoke
          retention-days: 30
      - name: Publish validated image set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-image-set
          path: artifacts/release/image-set.json
          if-no-files-found: error
          retention-days: 30

  native-docker:
    name: Build native canary candidate - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: admin
            dockerfile: Services/ConduitLLM.Admin/Dockerfile.native
          - service: http
            dockerfile: Services/ConduitLLM.Gateway/Dockerfile.native

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native canary candidate
        id: native-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.REGISTRY }}/nickna/conduit-${{ matrix.service }}-native:${{ needs.metadata.outputs.version }}-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.service }}-native
          cache-to: type=gha,scope=${{ matrix.service }}-native,mode=max
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT_SHA=${{ needs.metadata.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ needs.metadata.outputs.build_timestamp }}

      - name: Prepare native security evidence
        run: mkdir -p artifacts/security
      - name: Scan native candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ env.REGISTRY }}/nickna/conduit-${{ matrix.service }}-native@${{ steps.native-build.outputs.digest }}
          format: json
          output: artifacts/security/native.json
          exit-code: '0'
      - name: Enforce native candidate security policy
        run: node scripts/ci/security-check.mjs image artifacts/security/native.json
      - name: Retain native security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-security-${{ matrix.service }}
          path: artifacts/security
          retention-days: 30

      - name: Execute exact native candidate entrypoint
        run: |
          docker pull "$CI_NATIVE_IMAGE"
          node scripts/aot/native-container-smoke.mjs "$CI_NATIVE_IMAGE" "$CI_NATIVE_SERVICE"
        env:
          CI_NATIVE_IMAGE: ${{ env.REGISTRY }}/nickna/conduit-${{ matrix.service }}-native@${{ steps.native-build.outputs.digest }}
          CI_NATIVE_SERVICE: ${{ matrix.service }}
      - name: Retain native candidate execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-candidate-evidence-${{ matrix.service }}
          path: artifacts/native-containers
          retention-days: 30

      - name: Export native symbols
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: symbols
          platforms: linux/amd64
          outputs: type=local,dest=artifacts/native-symbols
          cache-from: type=gha,scope=${{ matrix.service }}-native
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT_SHA=${{ needs.metadata.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ needs.metadata.outputs.build_timestamp }}

      - name: Upload secured native symbols artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conduit-${{ matrix.service }}-linux-x64-native-symbols-${{ needs.metadata.outputs.version }}
          path: artifacts/native-symbols
          retention-days: 14

  production:
    name: Serialize migration and verified promotion
    runs-on: ubuntu-latest
    needs: [metadata, candidates]
    timeout-minutes: 40
    environment: production
    concurrency:
      group: conduit-production-release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-image-set
          path: artifacts/release
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preflight all candidates and reject stale channel updates before migration
        run: node scripts/ci/release-images.mjs preflight artifacts/release/image-set.json artifacts/release/promotion-ledger.json
      - name: Apply database migrations from the tested Admin digest
        run: |
          test -n "$DATABASE_URL"
          ADMIN=$(node -e 'const s=require("./artifacts/release/image-set.json"); const i=s.images.find(i=>i.service==="admin"); process.stdout.write(i.image+"@"+i.digest)')
          docker run --rm --entrypoint dotnet \
            --env DATABASE_URL \
            --env CONDUIT_MIGRATION_LOCK_TIMEOUT_SECONDS=600 \
            --env ConduitLLM__Messaging__Wolverine__AutoProvision=false \
            "$ADMIN" /app/migrator/ConduitLLM.Migrator.dll
          node scripts/ci/release-images.mjs migrated artifacts/release/promotion-ledger.json
        env:
          DATABASE_URL: ${{ secrets.CONDUIT_RELEASE_DATABASE_URL }}
      - name: Promote and verify the complete image set with rollback on failure
        run: node scripts/ci/release-images.mjs promote artifacts/release/promotion-ledger.json
      - name: Create GitHub Release with verified image set
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          make_latest: ${{ needs.metadata.outputs.channel == 'latest' }}
          files: |
            artifacts/release/image-set.json
            artifacts/release/promotion-ledger.json
      - name: Retain promotion and recovery ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-promotion-ledger
          path: artifacts/release
          retention-days: 90
