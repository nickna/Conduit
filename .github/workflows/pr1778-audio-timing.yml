name: PR 1778 audio transfer timing

on:
  push:
    branches: [codex/pr1778-audio-timing]

permissions:
  contents: read

concurrency:
  group: phase3-performance-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  matched:
    name: Trace three audio uploads (X64)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: X64
            runner: ubuntu-24.04
            profile: main
            timeout_minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CANDIDATE_REVISION: '7327d9e3075992386fa4866c22da68c6db770e7a'
      BASELINE_REVISION: '8e0e2372811554a4b4546d892b5a48b197c05b27'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - name: Verify frozen fixture bytes
        shell: pwsh
        run: ./scripts/qualification/verify-frozen-inputs.ps1 -OutputPath '${{ runner.temp }}/phase3-input-integrity.json'
      - name: Trace the matched audio endpoint
        shell: pwsh
        run: >-
          ./scripts/performance/phase3/run-paired-gateway.ps1
          -CandidateRevision $env:CANDIDATE_REVISION -BaselineRevision $env:BASELINE_REVISION
          -Architecture X64 -Profile main -Runs 6 -InterleavedControl -CalibrateControl
          -OutputDirectory '${{ runner.temp }}/phase3-gateway'
      - name: Retain sources, individual measurements and financial evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3-${{ matrix.arch }}-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/phase3-input-integrity.json
            ${{ runner.temp }}/phase3-gateway
            ${{ runner.temp }}/phase3-queue
            ${{ runner.temp }}/phase3-queue-policy
            ${{ runner.temp }}/phase3-micro-inventory-tests
            !${{ runner.temp }}/phase3-gateway/work/fixed/**
            !${{ runner.temp }}/phase3-gateway/work/candidate/**
            !${{ runner.temp }}/phase3-gateway/work/legacy/**
            !${{ runner.temp }}/phase3-gateway/work/seed-source/**
            !${{ runner.temp }}/phase3-gateway/*/work/fixed/**
            !${{ runner.temp }}/phase3-gateway/*/work/candidate/**
            !${{ runner.temp }}/phase3-gateway/*/work/legacy/**
            !${{ runner.temp }}/phase3-gateway/*/work/seed-source/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Evaluate the registered workload budgets
        shell: pwsh
        run: |
          $s = Get-Content -Raw '${{ runner.temp }}/phase3-gateway/summary.json' | ConvertFrom-Json
          if (!$s.collectionValidated -or !$s.allWorkloadsPassed -or $s.runs.Count -ne 54) { throw 'Incomplete audio collection' }
          foreach ($g in ($s.comparisons | Group-Object case)) {
            $pairs = @($g.Group | ForEach-Object { "$($_.baseline)->$($_.candidate)" })
            if ($pairs.Count -ne 4 -or (Compare-Object $pairs @('fixed->legacy','legacy->fixed','fixed->candidate','legacy->candidate'))) { throw 'Incomplete paired comparisons' }
          }
          $failures = @(foreach ($c in $s.comparisons) {
            if ($c.metrics.serverWindowCpuMillisecondsPerValidated.pairs -ne 6) { throw 'Incomplete CPU pairs' }
            foreach ($m in $c.metrics.PSObject.Properties) {
              if ($m.Value.status -eq 'outside-working-threshold') { "$($c.case) $($c.baseline)->$($c.candidate) $($m.Name) $($m.Value.medianPairedRatio)" }
            }
          })
          $failures | Write-Output
          if ($failures.Count) { throw 'An existing workload budget was exceeded in the separate trace' }
