name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
      build_timestamp: ${{ steps.version.outputs.build_timestamp }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version and channel
        id: version
        # A tag is a pre-release iff its name contains a hyphen (SemVer rule).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "build_timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: Build candidate - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: webadmin
            context: .
            dockerfile: WebAdmin/Dockerfile
          - service: http
            context: .
            dockerfile: Services/ConduitLLM.Gateway/Dockerfile
          - service: admin
            context: .
            dockerfile: Services/ConduitLLM.Admin/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # Candidate tags are not consumed by deployments. Official version/channel
          # tags are promoted only after the production migration succeeds.
          tags: ${{ env.REGISTRY }}/nickna/conduit-${{ matrix.service }}:${{ needs.metadata.outputs.version }}-candidate
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT_SHA=${{ needs.metadata.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ needs.metadata.outputs.build_timestamp }}

  native-docker:
    name: Build native canary candidate - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: metadata
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: admin
            dockerfile: Services/ConduitLLM.Admin/Dockerfile.native
          - service: http
            dockerfile: Services/ConduitLLM.Gateway/Dockerfile.native

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native canary candidate
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.REGISTRY }}/nickna/conduit-${{ matrix.service }}-native:${{ needs.metadata.outputs.version }}-candidate
          cache-from: type=gha,scope=${{ matrix.service }}-native
          cache-to: type=gha,scope=${{ matrix.service }}-native,mode=max
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT_SHA=${{ needs.metadata.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ needs.metadata.outputs.build_timestamp }}

      - name: Scan native candidate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/nickna/conduit-${{ matrix.service }}-native:${{ needs.metadata.outputs.version }}-candidate
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      - name: Export native symbols
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: symbols
          platforms: linux/amd64
          outputs: type=local,dest=artifacts/native-symbols
          cache-from: type=gha,scope=${{ matrix.service }}-native
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT_SHA=${{ needs.metadata.outputs.commit_sha }}
            BUILD_TIMESTAMP=${{ needs.metadata.outputs.build_timestamp }}

      - name: Upload secured native symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: conduit-${{ matrix.service }}-linux-x64-native-symbols-${{ needs.metadata.outputs.version }}
          path: artifacts/native-symbols
          retention-days: 14

  migrate:
    name: Production migration gate
    runs-on: ubuntu-latest
    needs: [metadata, docker]
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DATABASE_URL: ${{ secrets.CONDUIT_RELEASE_DATABASE_URL }}

    steps:
      - name: Require release database secret
        run: test -n "$DATABASE_URL"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply database migrations
        # A non-zero migrator exit code stops the workflow before any official image
        # tag or GitHub Release is updated. Re-running the job is idempotent.
        run: |
          docker run --rm \
            --entrypoint dotnet \
            --env DATABASE_URL \
            --env CONDUIT_MIGRATION_LOCK_TIMEOUT_SECONDS=600 \
            --env ConduitLLM__Messaging__Wolverine__AutoProvision=false \
            "${{ env.REGISTRY }}/nickna/conduit-admin:${{ needs.metadata.outputs.version }}-candidate" \
            /app/migrator/ConduitLLM.Migrator.dll

  promote:
    name: Promote release images
    runs-on: ubuntu-latest
    needs: [metadata, migrate]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate tags
        run: |
          for SERVICE in webadmin http admin; do
            SOURCE="${{ env.REGISTRY }}/nickna/conduit-${SERVICE}:${{ needs.metadata.outputs.version }}-candidate"
            docker buildx imagetools create \
              --tag "${{ env.REGISTRY }}/nickna/conduit-${SERVICE}:${{ needs.metadata.outputs.version }}" \
              --tag "${{ env.REGISTRY }}/nickna/conduit-${SERVICE}:${{ needs.metadata.outputs.channel }}" \
              "$SOURCE"
          done

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [metadata, promote]
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          # Only stable releases become the repo's "Latest"; betas never move it.
          make_latest: ${{ needs.metadata.outputs.channel == 'latest' }}
