# Keep this configuration on master (the default and active development branch).
# GitHub Actions updates remain manual because reviewed SHAs must also be updated
# in scripts/ci/action-versions.json. See docs/operations/dependency-updates.md.
# Batch minor/patch updates per job; review majors by family or individually.
# Keep at most two version-update PRs open per job to avoid a maintenance flood.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      # ASP.NET Core OpenAPI 10.x requires OpenAPI.NET 2.x.
      - dependency-name: Microsoft.OpenApi
        versions: ['>=3']
    groups:
      nuget-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      efcore:
        update-types:
          - major
        patterns:
          - Microsoft.EntityFrameworkCore*
          - Npgsql*
          - Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore
      opentelemetry:
        update-types:
          - major
        patterns:
          - OpenTelemetry*
      aspnetcore:
        update-types:
          - major
        patterns:
          - Microsoft.AspNetCore*
          - Microsoft.Extensions*
      tokenizers:
        update-types:
          - major
        patterns:
          - Microsoft.ML.Tokenizers*
      wolverine:
        update-types:
          - major
        patterns:
          - WolverineFx*
      fusioncache:
        update-types:
          - major
        patterns:
          - ZiggyCreatures.FusionCache*
      test:
        update-types:
          - major
        patterns:
          - xunit*
          - Xunit.*
          - Moq*
          - AutoFixture*
          - AwesomeAssertions
          - FsCheck*
          - bunit
          - Microsoft.NET.Test.Sdk
          - coverlet*
          - Testcontainers*

  - package-ecosystem: npm
    directory: /WebAdmin
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      # React's lint plugin currently supports ESLint through major 9.
      - dependency-name: eslint
        versions: ['>=10']
      - dependency-name: '@eslint/js'
        versions: ['>=10']
      # ts-jest and typescript-eslint do not yet support TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7']
      # Keep the Node API types aligned with the Node 22 runtime in CI/Docker.
      - dependency-name: '@types/node'
        versions: ['>=23']
    groups:
      webadmin-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      mantine:
        update-types:
          - major
        patterns:
          - '@mantine/*'
      next-react:
        update-types:
          - major
        patterns:
          - next
          - '@next/*'
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      signalr:
        update-types:
          - major
        patterns:
          - '@microsoft/signalr*'

  - package-ecosystem: npm
    directory: /tools/openapi
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      openapi-tooling:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /tools/ci
    target-branch: master
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      ci-tooling:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
