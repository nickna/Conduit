name: PR 1778 ARM64 pressure control

on:
  push:
    branches: [codex/pr1778-dedicated-rerun]

permissions:
  contents: read

jobs:
  pressure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      BASELINE_REVISION: '96ffd94da1286becc60404858c948824235bea93'
      CANDIDATE_REVISION: '83508e1353be034eb5b615665eac3971a34b0570'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - name: Verify frozen fixture bytes
        shell: pwsh
        run: ./scripts/qualification/verify-frozen-inputs.ps1 -OutputPath '${{ runner.temp }}/phase3-arm64-pressure-frozen-inputs.json'
      - name: Run the full pressure profile with the byte-identical control
        shell: pwsh
        run: >-
          ./scripts/performance/phase3/run-paired-gateway.ps1
          -CandidateRevision $env:CANDIDATE_REVISION -BaselineRevision $env:BASELINE_REVISION
          -Architecture Arm64 -Profile pressure -Runs 6 -InterleavedControl -OutputDirectory '${{ runner.temp }}/phase3-arm64-pressure'
      - name: Retain raw comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-pressure-control-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/phase3-arm64-pressure-frozen-inputs.json
            ${{ runner.temp }}/phase3-arm64-pressure
            !${{ runner.temp }}/phase3-arm64-pressure/work/fixed/**
            !${{ runner.temp }}/phase3-arm64-pressure/work/legacy/**
            !${{ runner.temp }}/phase3-arm64-pressure/work/candidate/**
            !${{ runner.temp }}/phase3-arm64-pressure/work/seed-source/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Evaluate both control directions and candidate comparisons
        shell: pwsh
        run: >-
          ./scripts/performance/phase3/check-gateway-budgets.ps1
          -Profile pressure -InterleavedControl -EvidenceDirectory '${{ runner.temp }}/phase3-arm64-pressure'
