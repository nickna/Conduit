name: conduit-native-canary

x-common: &common
  restart: unless-stopped
  extra_hosts:
    - host.docker.internal:host-gateway
  environment: &common-environment
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the migrated canary database}
    REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the canary Redis instance}
    CONDUIT_MIGRATION_MODE: Skip
    ConduitLLM__Messaging__Wolverine__AutoProvision: "false"

services:
  admin-jit:
    <<: *common
    profiles: [admin]
    image: ${ADMIN_JIT_IMAGE:?Set ADMIN_JIT_IMAGE to the corresponding JIT release}
    ports:
      - 127.0.0.1:${ADMIN_JIT_PORT:-18080}:8080
    labels:
      io.conduit.canary.service: admin
      io.conduit.canary.runtime: jit

  admin-native:
    <<: *common
    profiles: [admin]
    image: ${ADMIN_NATIVE_IMAGE:?Set ADMIN_NATIVE_IMAGE to the native candidate digest}
    ports:
      - 127.0.0.1:${ADMIN_NATIVE_PORT:-18081}:8080
    labels:
      io.conduit.canary.service: admin
      io.conduit.canary.runtime: native-aot
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  gateway-jit:
    <<: *common
    profiles: [gateway]
    image: ${GATEWAY_JIT_IMAGE:?Set GATEWAY_JIT_IMAGE to the corresponding JIT release}
    ports:
      - 127.0.0.1:${GATEWAY_JIT_PORT:-18082}:8080
    labels:
      io.conduit.canary.service: gateway
      io.conduit.canary.runtime: jit

  gateway-native:
    <<: *common
    profiles: [gateway]
    image: ${GATEWAY_NATIVE_IMAGE:?Set GATEWAY_NATIVE_IMAGE to the native candidate digest}
    ports:
      - 127.0.0.1:${GATEWAY_NATIVE_PORT:-18083}:8080
    labels:
      io.conduit.canary.service: gateway
      io.conduit.canary.runtime: native-aot
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
