name: PR 1778 matched cancellation replay

on:
  push:
    branches: [codex/pr1778-cancel-order]

permissions:
  contents: read

jobs:
  cancellation-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      BASELINE_REVISION: '96ffd94da1286becc60404858c948824235bea93'
      CANDIDATE_REVISION: '297f3e8b52ddd186367e94cdb54daada8be396c0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - name: Validate frozen fixture bytes
        shell: pwsh
        run: ./scripts/qualification/verify-frozen-inputs.ps1 -OutputPath '${{ runner.temp }}/frozen-inputs.json'
      - name: Replay original mixed history with independent binary order
        shell: pwsh
        run: >-
          ./scripts/performance/phase3/run-paired-gateway.ps1
          -CandidateRevision $env:CANDIDATE_REVISION -BaselineRevision $env:BASELINE_REVISION
          -Architecture X64 -Runs 6 -InterleavedControl -CalibrateControl -CancelBeforeUsageReplay
          -OutputDirectory '${{ runner.temp }}/cancellation-timing'
      - name: Evaluate before-usage CPU budget in repetitions 3 through 6
        run: python scripts/performance/phase3/check-cancellation-replay.py '${{ runner.temp }}/cancellation-timing'
      - name: Retain comparison and financial evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amd64-cancellation-replay
          path: |
            ${{ runner.temp }}/frozen-inputs.json
            ${{ runner.temp }}/cancellation-timing
            !${{ runner.temp }}/cancellation-timing/work/fixed/**
            !${{ runner.temp }}/cancellation-timing/work/legacy/**
            !${{ runner.temp }}/cancellation-timing/work/candidate/**
            !${{ runner.temp }}/cancellation-timing/work/seed-source/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
