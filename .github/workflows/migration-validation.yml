name: Migration Validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

concurrency:
  group: migration-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-migrations:
    name: Validate migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://conduit:conduitpass@localhost:5432/conduitdb
      ConduitEfTooling: 'true'
      CONDUIT_CI_REQUIRED_INFRASTRUCTURE: 'true'
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduitpass
          POSTGRES_DB: conduitdb
        options: >-
          --health-cmd "pg_isready -U conduit -d conduitdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The repo has a tool manifest (.config/dotnet-tools.json) pinning dotnet-ef;
      # newer SDKs resolve the local manifest first, so a global install is shadowed
      # and `dotnet ef` fails with "Run dotnet tool restore" until the manifest is
      # restored. Restore the pinned tools instead of installing globally.
      - name: Restore dotnet tools
        run: dotnet tool restore

      # The validation script invokes dotnet-ef with --no-build
      - name: Build Configuration project
        run: dotnet build Shared/ConduitLLM.Configuration

      - name: Validate migrations
        shell: pwsh
        run: ./scripts/migrations/validate-migrations.ps1 -CheckPending

      - name: Verify mandatory timeout and tooling policy
        shell: pwsh
        run: ./scripts/migrations/test-bounded-command.ps1

      - name: Exercise release migration gate
        run: >-
          dotnet test Tests/ConduitLLM.Tests/ConduitLLM.Tests.csproj
          --configuration Release
          --filter FullyQualifiedName~ReleaseMigrationCommandTests
          --logger 'trx;LogFileName=migrations.trx'
          --results-directory artifacts/migrations

      - name: Exercise native PostgreSQL persistence probe
        shell: pwsh
        run: ./scripts/aot/persistence-native-smoke.ps1 -Runtime linux-x64

      - name: Generate idempotent migration script
        run: |
          mkdir -p artifacts
          dotnet ef migrations script --idempotent \
            --project Shared/ConduitLLM.Configuration \
            --output artifacts/conduit-migrations-idempotent.sql

      # Reviewable, rerunnable artifact — the escape hatch for DBA review or
      # manual application when the release-hook migrator is not used.
      - name: Upload idempotent script artifact
        uses: actions/upload-artifact@v4
        with:
          name: conduit-migrations-idempotent
          path: artifacts/conduit-migrations-idempotent.sql
          retention-days: 90

      - name: Upload migration failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-validation-evidence
          path: |
            artifacts/migrations
            artifacts/persistence-native
          retention-days: 30
