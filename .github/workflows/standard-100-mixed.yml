name: PR 1778 focused mixed standard-100 CPU

on:
  push:
    branches: [codex/pr1778-standard100]

permissions:
  contents: read

jobs:
  mixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      BASELINE_REVISION: '96ffd94da1286becc60404858c948824235bea93'
      CANDIDATE_REVISION: 'cf7d5e294a8931a7f34f6fc3511f355098efc2bb'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - name: Verify frozen fixture bytes
        shell: pwsh
        run: ./scripts/qualification/verify-frozen-inputs.ps1 -OutputPath '${{ runner.temp }}/frozen-inputs.json'
      - name: Collect the original primary mixed history
        shell: pwsh
        run: >-
          ./scripts/performance/phase3/run-paired-gateway.ps1
          -CandidateRevision $env:CANDIDATE_REVISION -BaselineRevision $env:BASELINE_REVISION
          -Architecture X64 -Runs 6 -InterleavedControl -PrimaryOnly
          -OutputDirectory '${{ runner.temp }}/standard-100'
      - name: Check the standard-100 CPU comparisons
        run: python scripts/performance/phase3/check-standard-100-cpu.py '${{ runner.temp }}/standard-100'
      - name: Retain full primary evidence and focused result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amd64-standard-100-with-mixed-history
          path: |
            ${{ runner.temp }}/frozen-inputs.json
            ${{ runner.temp }}/standard-100
            !${{ runner.temp }}/standard-100/work/fixed/**
            !${{ runner.temp }}/standard-100/work/legacy/**
            !${{ runner.temp }}/standard-100/work/candidate/**
            !${{ runner.temp }}/standard-100/work/seed-source/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
