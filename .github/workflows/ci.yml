name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      measure_previous_scheduling:
        description: 'Controlled measurement only: restore serialized packaged builds and duplicate lock-policy runs'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migration validation
    uses: ./.github/workflows/migration-validation.yml

  distributed-lock:
    name: Distributed lock validation
    uses: ./.github/workflows/distributed-lock.yml
    with:
      repeat_policy_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.measure_previous_scheduling }}

  codeql:
    name: Security analysis
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/codeql-analysis.yml

  dependencies:
    name: Dependency security policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore the consumed NuGet graph
        run: dotnet restore Conduit.slnx
      - name: Capture explicit NuGet and npm advisory inventories
        shell: bash
        run: |
          mkdir -p artifacts/security
          dotnet list Conduit.slnx package --no-restore --vulnerable --include-transitive --format json --output-version 1 > artifacts/security/nuget.json
          for SCOPE in WebAdmin tools/openapi tools/ci; do
            FILE=${SCOPE//\//-}
            # npm returns 1 for findings as well as network failures. The policy
            # parser rejects failed/malformed audits; advisories remain inspectable.
            (cd "$SCOPE" && npm audit --package-lock-only --json --fetch-timeout=30000 --fetch-retries=0) > "artifacts/security/$FILE.json" || true
          done
      - name: Enforce dependency severity and approved exception policy
        run: node scripts/ci/security-check.mjs dependency
      - name: Retain advisory inventories even when blocked
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-security-evidence
          path: artifacts/security
          retention-days: 30

  required:
    name: CI required
    if: ${{ always() }}
    needs: [source-ignore-guard, media-dispatch-integration, billing-fault-injection, billing-invariants, signalr-integration, aot-analyzers, validate, wolverine-two-host, docker, s3-storage, contracts, webadmin, migrations, distributed-lock, codeql, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every validation result
        run: node scripts/ci/required-check.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}

  media-dispatch-integration:
    name: Durable media dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run PostgreSQL and Wolverine crash and dispatch tests
        uses: ./.github/actions/run-tests
        with:
          project: Tests/ConduitLLM.IntegrationTests/ConduitLLM.IntegrationTests.csproj
          suite: media-dispatch
          filter: Component=MediaDispatch

  source-ignore-guard:
    name: Source ignore guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/ci/package-lock.json
      - name: Install parsed workflow tooling
        run: npm ci --prefix tools/ci
      - name: Validate Actions syntax, expressions and required job graph
        run: pwsh ./scripts/test/validate-workflows.ps1
      - name: Check native Docker SDK compatibility
        run: node scripts/ci/native-sdk.mjs
      - name: Exercise validation policy regressions
        run: node --test scripts/ci/*.test.mjs
      - name: Exercise discovery and coverage regressions
        run: python scripts/ci/test_test_evidence.py
      - name: Ensure source files are not ignored
        shell: bash
        run: |
          ignored_sources="$(
            {
              git ls-files --cached --ignored --exclude-standard -- \
                'Shared/**' 'Services/**' 'Tests/**' 'WebAdmin/src/**'
              git ls-files --others --ignored --exclude-standard -- \
                'Shared/**' 'Services/**' 'Tests/**' 'WebAdmin/src/**'
            } | grep -E '\.(cs|ts|tsx)$' | sort -u || true
          )"

          if [[ -n "$ignored_sources" ]]; then
            echo "::error::Source files must not be excluded by .gitignore:"
            echo "$ignored_sources"
            exit 1
          fi

  billing-fault-injection:
    name: Billing fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run billing durability fault tests
        uses: ./.github/actions/run-tests
        with:
          project: Tests/ConduitLLM.FaultInjectionTests/ConduitLLM.FaultInjectionTests.csproj
          suite: billing-fault-injection

  billing-invariants:
    name: Billing invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run required billing invariant gate
        uses: ./.github/actions/run-tests
        with:
          project: Tests/ConduitLLM.BillingInvariantTests/ConduitLLM.BillingInvariantTests.csproj
          suite: billing-invariants
          maximum-skips: '1'

  signalr-integration:
    name: SignalR integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run self-contained SignalR integration tests
        uses: ./.github/actions/run-tests
        with:
          project: Tests/ConduitLLM.IntegrationTests/ConduitLLM.IntegrationTests.csproj
          suite: signalr
          filter: Component=SignalR

  s3-storage:
    name: S3 video operations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: ./.github/actions/run-tests
        with:
          project: Tests/ConduitLLM.IntegrationTests/ConduitLLM.IntegrationTests.csproj
          suite: s3-storage
          filter: Component=S3Storage
          minimum: '3'

  aot-analyzers:
    name: NativeAOT analyzer ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore service graphs
        run: |
          dotnet restore Services/ConduitLLM.Admin/ConduitLLM.Admin.csproj
          dotnet restore Services/ConduitLLM.Gateway/ConduitLLM.Gateway.csproj
      - name: Run analyzer-only AOT audit
        shell: pwsh
        run: ./scripts/aot/aot-audit.ps1 -NoRestore
      - name: Add diagnostic counts to job summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/aot-audit/summary.md) {
            Get-Content artifacts/aot-audit/summary.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload AOT analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aot-analyzer-diagnostics
          path: artifacts/aot-audit
          retention-days: 30

  # Quick validation that everything builds
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduitpass
          POSTGRES_DB: conduitdb
        options: >-
          --health-cmd "pg_isready -U conduit -d conduitdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      
      - name: .NET Build
        run: |
          dotnet restore
          dotnet build --no-restore

      - name: Main correctness suite and coverage
        uses: ./.github/actions/run-tests
        with:
          project: Tests/ConduitLLM.Tests/ConduitLLM.Tests.csproj
          suite: core
          configuration: Debug
          no-build: 'true'
          coverage: 'true'
          filter: Component!=ReleaseMigration
          minimum: '3753'
          maximum-skips: '3'
        env:
          TEST_REDIS_CONNECTION: localhost:6379
          DATABASE_URL: postgresql://conduit:conduitpass@localhost:5432/conduitdb
          CONDUIT_CACHE_TEST_REDIS: localhost:6379
          CONDUIT_CACHE_TEST_POSTGRES: Host=localhost;Port=5432;Database=conduitdb;Username=conduit;Password=conduitpass

      - name: Reflection-disabled serialization suite
        uses: ./.github/actions/run-tests
        with:
          project: Tests/ConduitLLM.SerializationTests/ConduitLLM.SerializationTests.csproj
          suite: serialization
          configuration: Debug
          no-build: 'true'

      - name: Enforce measured backend component coverage
        shell: pwsh
        run: |
          $coverage = Get-ChildItem artifacts/tests/core -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $coverage) { throw 'Required backend coverage is missing' }
          python scripts/ci/coverage-ratchet.py dotnet $coverage.FullName

      - name: Verify restored functional suite ownership
        shell: pwsh
        run: ./scripts/ci/verify-functional-results.ps1 -Results artifacts/tests/core/core.trx

      - name: Verify main ownership of lock policy cases
        run: python scripts/ci/verify-lock-ownership.py artifacts/tests/core/core.json

      - name: Admin media request-delegate generation guard
        shell: pwsh
        run: ./scripts/test/verify-admin-media-rdg.ps1 -NoRestore

      - name: Gateway request-delegate generation guard
        shell: pwsh
        run: ./scripts/test/verify-gateway-rdg.ps1 -NoRestore

      - name: Exception logging ownership guard
        shell: pwsh
        run: ./scripts/test/verify-exception-logging.ps1

      # Regenerate every registered handler adapter and fail on tracked, deleted,
      # or newly untracked output. The compiler dependency is generation-only.
      - name: Wolverine static codegen drift check
        shell: pwsh
        run: ./scripts/generate-wolverine-code.ps1 -Verify
        env:
          ConduitLLM__Messaging__Backend: Wolverine
          ConduitLLM__Messaging__Wolverine__Transport: Postgresql
          CONDUIT_MIGRATION_MODE: Skip
          ASPNETCORE_ENVIRONMENT: Production
          DATABASE_URL: postgresql://conduit:conduitpass@localhost:5432/conduitdb
          REDIS_URL: redis://localhost:6379

      - name: Wolverine production dependency guard
        shell: bash
        run: |
          publish_root="$RUNNER_TEMP/wolverine-static-publish"
          for service in Gateway Admin; do
            project="Services/ConduitLLM.$service/ConduitLLM.$service.csproj"
            output="$publish_root/$service"

            dotnet publish "$project" --configuration Release --output "$output"

            forbidden="$(
              find "$output" -maxdepth 1 -type f \
                \( -iname 'Wolverine.RuntimeCompilation*' \
                   -o -iname 'JasperFx.RuntimeCompiler*' \
                   -o -iname 'Microsoft.CodeAnalysis*' \) \
                -printf '%f\n'
            )"

            if [[ -n "$forbidden" ]]; then
              echo "::error::$service publish contains runtime compiler artifacts:"
              echo "$forbidden"
              exit 1
            fi
          done

  contracts:
    name: Contracts and official SDK clients
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/openapi/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: OpenAPI contract validation and drift check
        # Export both contracts without infrastructure, prove generation is byte-stable,
        # regenerate WebAdmin contract types, validate the contracts, and fail on drift.
        run: |
          dotnet restore Services/ConduitLLM.Admin/ConduitLLM.Admin.csproj
          dotnet restore Services/ConduitLLM.Gateway/ConduitLLM.Gateway.csproj
          cd tools/openapi
          npm ci
          npm run verify:offline
          npm run validate:openapi
          cd "$GITHUB_WORKSPACE"
          if ! git diff --exit-code -- \
            Services/ConduitLLM.Admin/openapi-admin.json \
            Services/ConduitLLM.Gateway/openapi-gateway.json \
            WebAdmin/src/generated/admin-api.ts \
            WebAdmin/src/generated/gateway-api.ts; then
            echo "::error::OpenAPI contracts or generated WebAdmin types are out of date. Run 'npm run generate:offline' in tools/openapi and commit the changes."
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://conduit:conduitpass@localhost:5432/conduitdb

      - name: Official OpenAI SDK smoke against Gateway
        run: python -m pip install -r tools/openapi/sdk-smoke/requirements.txt

      - name: Execute official SDK clients against real Gateway
        uses: ./.github/actions/run-tests
        with:
          project: Tests/ConduitLLM.IntegrationTests/ConduitLLM.IntegrationTests.csproj
          suite: openai-sdk
          configuration: Debug
          filter: Component=OpenAiSdkSmoke

  webadmin:
    name: WebAdmin correctness and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: WebAdmin/package-lock.json
      - name: WebAdmin Lint, Type Check & Tests
        run: |
          cd WebAdmin
          npm ci
          # Clean any stale .next directory before type checking
          rm -rf .next
          npm run lint
          npm run type-check
          npm run check:api-boundary
          npm run test:coverage -- --runInBand --json --outputFile=coverage/test-results.json
          node ../scripts/ci/jest-evidence.mjs coverage/test-results.json
          python ../scripts/ci/coverage-ratchet.py jest coverage/coverage-final.json

      - name: Enforce measured CSS budgets and unused-code cleanliness
        working-directory: .
        run: node scripts/ci/webadmin-hygiene.mjs
      - name: Retain CSS and unused-code reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webadmin-hygiene-evidence
          path: artifacts/webadmin-hygiene
          retention-days: 30
      - name: Retain WebAdmin results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-webadmin
          path: WebAdmin/coverage
          retention-days: 30

  # Two-host Wolverine listener assertion (#961): boots the REAL Gateway + Admin hosts
  # against real Postgres with ConduitLLM:Messaging:Backend=Wolverine and asserts that
  # each service forms its own node cluster (per-service durability schema) and that the
  # Gateway starts listeners for all five queues, including the exclusive strict-ordered
  # spend-update-events / image-generation-events. Guards against W1 from the #929 S1
  # smoke (shared agent cluster => financial queue dead), which only exists with two
  # real hosts on real Postgres and is invisible to the in-memory dual-backend tests.
  wolverine-two-host:
    name: Wolverine Two-Host Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduitpass
          POSTGRES_DB: conduitdb
        options: >-
          --health-cmd "pg_isready -U conduit -d conduitdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build services
        run: |
          dotnet build Services/ConduitLLM.Gateway
          dotnet build Services/ConduitLLM.Admin
          dotnet build tools/WolverineSmokePublisher
          dotnet build tools/ConduitLLM.Migrator

      - name: Two-host listener assertion
        run: pwsh ./scripts/test/wolverine-two-host-smoke.ps1 -NoBuild
        env:
          DATABASE_URL: postgresql://conduit:conduitpass@localhost:5432/conduitdb
          REDIS_URL: redis://localhost:6379

  # Build and execute the same packaged applications used by release candidates.
  docker:
    name: Packaged application business flows
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Controlled previous scheduling barrier
        if: github.event_name == 'workflow_dispatch' && inputs.measure_previous_scheduling
        run: node scripts/ci/measure-scheduling.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify digest-preserving registry promotion
        run: node scripts/ci/registry-copy-smoke.mjs
      - name: Build admin production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Services/ConduitLLM.Admin/Dockerfile
          platforms: linux/amd64
          load: true
          tags: conduit-admin:ci
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
      - name: Build http production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Services/ConduitLLM.Gateway/Dockerfile
          platforms: linux/amd64
          load: true
          tags: conduit-http:ci
          cache-from: type=gha,scope=http
          cache-to: type=gha,scope=http,mode=max
      - name: Build webadmin production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: WebAdmin/Dockerfile
          platforms: linux/amd64
          load: true
          tags: conduit-webadmin:ci
          cache-from: type=gha,scope=webadmin
          cache-to: type=gha,scope=webadmin,mode=max
      - name: Install locked browser tooling
        working-directory: tools/ci
        run: |
          npm ci
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Execute packaged business and browser flows
        run: node scripts/ci/container-smoke.mjs
        env:
          CI_BROWSER_MODULE: tools/ci/browser-smoke.mjs
      - name: Retain packaged execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-application-evidence
          path: |
            artifacts/container-smoke
            artifacts/registry-copy
          retention-days: 30
